<style>
/* Layout: analysis console in the Dimas HUB visual system (white, black, greys, purple action color). */
:root{
  --bg:#f7f7f7; --surface:#ffffff; --surface-2:#f0f0f0; --line:#e3e3e3;
  --fg:#000000; --muted:#737373; --accent:#9b65c5; --accent-fg:#ffffff; --accent-dark:#512465;
  --live:#e5533d; --brand2:#9b65c5; --warn:#9a3412; --ok:#16a34a;
  --shadow:0 1px 2px rgba(0,0,0,.05),0 8px 24px -12px rgba(0,0,0,.18);
  --f-display:"Saira Condensed","Arial Narrow",Impact,sans-serif;
  --f-body:"Inter","Open Sans",system-ui,-apple-system,"Segoe UI",sans-serif;
  --f-mono:"JetBrains Mono",ui-monospace,Menlo,Consolas,monospace;
  --r:14px;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#0d0d0d; --surface:#161616; --surface-2:#202020; --line:#2c2c2c;
  --fg:#f5f5f5; --muted:#9a9a9a; --accent:#b58ad6; --accent-fg:#141414; --accent-dark:#9b65c5;
  --live:#ff7a66; --brand2:#b58ad6; --warn:#fed7aa; --ok:#3ec27a;
  --shadow:0 1px 2px rgba(0,0,0,.4),0 8px 24px -12px rgba(0,0,0,.6); color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0d0d0d; --surface:#161616; --surface-2:#202020; --line:#2c2c2c;
  --fg:#f5f5f5; --muted:#9a9a9a; --accent:#b58ad6; --accent-fg:#141414; --accent-dark:#9b65c5;
  --live:#ff7a66; --brand2:#b58ad6; --warn:#fed7aa; --ok:#3ec27a;
  --shadow:0 1px 2px rgba(0,0,0,.4),0 8px 24px -12px rgba(0,0,0,.6); color-scheme:dark}
html,body{height:100%}
body{background:var(--bg);color:var(--fg);font-family:var(--f-body);font-size:14px;line-height:1.45}
*{box-sizing:border-box}
[hidden]{display:none!important}
button,input,select,textarea{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.wrap{max-width:1280px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:20px 48px}
h1,h2,h3{font-family:var(--f-display);font-weight:700;letter-spacing:.02em;text-wrap:balance;margin:0}
h2{text-transform:uppercase;letter-spacing:.04em;font-weight:800}
.eyebrow{font-family:var(--f-display);text-transform:uppercase;letter-spacing:.08em;font-size:13px;font-weight:700;color:var(--muted)}
.muted{color:var(--muted)}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;border:1px solid var(--line);background:var(--surface);border-radius:8px;padding:8px 14px;cursor:pointer;font-weight:500;font-size:13px;white-space:nowrap;transition:background .12s,border-color .12s}
.btn:hover{background:var(--surface-2)}
.btn.primary{background:var(--accent);color:var(--accent-fg);border-color:transparent;font-weight:600}
.btn.primary:hover{background:var(--accent-dark);color:#fff}
.btn.danger{color:var(--live)}
.btn.ghost{background:transparent;border-color:transparent}
.btn.sm{padding:5px 10px;font-size:13px}
.btn:disabled{opacity:.45;cursor:not-allowed}
input[type=text],input[type=number],input[type=date],input[type=time],select,textarea{background:var(--surface-2);border:1px solid var(--line);border-radius:6px;padding:7px 10px;width:100%;min-width:0;font-size:13px}

label.f{display:flex;flex-direction:column;gap:4px;font-size:13px;color:var(--muted);min-width:0}

/* ---------- start screen ---------- */
.home-head{display:flex;flex-wrap:wrap;align-items:flex-end;justify-content:space-between;gap:16px;padding-block:12px 24px;border-bottom:1px solid var(--line);margin-bottom:24px}
.brand{display:flex;align-items:center;gap:14px}
.brand svg{flex:none}

.home-grid{display:grid;grid-template-columns:minmax(0,360px) minmax(0,1fr);gap:28px;align-items:start}
@media (max-width:820px){.home-grid{grid-template-columns:1fr}}
.panel{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:18px;box-shadow:var(--shadow)}

.seg{display:grid;grid-template-columns:1fr 1fr;gap:2px;background:var(--surface-2);border:1px solid var(--line);border-radius:999px;padding:3px}

.stack{display:flex;flex-direction:column;gap:12px}

.item:hover{transform:translateY(-2px);box-shadow:0 2px 4px rgba(0,0,0,.06),0 16px 32px -14px rgba(0,0,0,.28)}
.item{box-shadow:var(--shadow);transition:transform .15s,box-shadow .15s}
.item h3{font-size:20px;overflow-wrap:anywhere}
.item .meta{font-size:13px;color:var(--muted)}
.typebadge{font-family:var(--f-display);font-weight:700;font-size:11px;letter-spacing:.06em;text-transform:uppercase;border-radius:4px;padding:3px 7px}
.typebadge.jogo{background:var(--accent);color:var(--accent-fg)}
.typebadge.treino{background:var(--fg);color:var(--bg)}
.pill{display:inline-block;font-size:12px;border-radius:99px;padding:1px 8px;background:var(--surface-2);color:var(--muted);font-weight:600}
.pill.live{background:var(--accent);color:var(--accent-fg)}
.empty{border:1px dashed var(--line);border-radius:var(--r);padding:28px;text-align:center;color:var(--muted)}

/* ---------- analysis screen ---------- */

.clocks{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.clocks.one{grid-template-columns:minmax(0,1fr)}
.clocks.one .clock{display:grid;grid-template-columns:auto minmax(0,1fr) auto;grid-template-areas:"row row row" "time name sync" "time ctrls list";column-gap:24px;align-items:center}

.blocklist .bl{display:flex;justify-content:space-between;gap:14px}.blocklist .bl b{font-weight:600}
.blocklist .live{color:var(--accent-dark);font-weight:700}
.themebtn{width:36px;height:36px;padding:0!important;border-radius:50%;flex:none}
.themebtn svg{width:18px;height:18px;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.btn.sync{border-color:var(--fg);font-weight:600}
.btn.sync .kk{font-family:var(--f-mono);font-size:11px;color:var(--muted)}
.sw.sync{background:var(--fg)!important;border-radius:50%}
.clocks.one .row{grid-area:row}.clocks.one .time{grid-area:time;font-size:clamp(44px,7vw,64px)}.clocks.one .sessname{grid-area:name}.clocks.one .ctrls{grid-area:ctrls}
@media (max-width:560px){.clocks.one .clock{grid-template-columns:minmax(0,1fr);grid-template-areas:"row" "time" "name" "ctrls" "sync" "list"}}
@media (max-width:560px){.blocklist{justify-self:stretch;margin-top:8px}}
@media (max-width:520px){.clocks{grid-template-columns:minmax(0,1fr)}}
.clock{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:14px 16px;display:flex;flex-direction:column;gap:8px}

.pad-inner{display:grid;grid-template-columns:repeat(auto-fill,minmax(168px,1fr));gap:10px}

.padgrp .eyebrow{padding-bottom:4px;border-bottom:1px solid var(--line)}
.tagbtn{position:relative;min-height:72px;border-radius:8px;border:0;cursor:pointer;color:#111;padding:10px 12px;text-align:left;display:flex;flex-direction:column;justify-content:space-between;gap:6px;font-family:var(--f-display);font-size:20px;font-weight:700;line-height:1.05;letter-spacing:.01em;box-shadow:inset 0 -3px 0 rgba(0,0,0,.18);transition:transform .06s}
.action-row{margin-bottom:4px}
.qp.rate .col{background:#d4d4d8}.qp.rate .ind{background:#bfdbfe}
.tagbtn:active,.tagbtn.flash{transform:scale(.97);filter:brightness(1.15)}
.tagbtn .k{position:absolute;top:8px;right:8px;font-family:var(--f-mono);font-size:11px;background:rgba(127,127,127,.3);color:inherit;border-radius:4px;padding:1px 6px}
.tagbtn .m{font-family:var(--f-body);font-size:11.5px;font-weight:500;opacity:.75}
.tagbtn.open{outline:2px solid var(--fg);outline-offset:0;box-shadow:0 0 0 3px rgba(229,83,61,.35);animation:pulse 1s infinite}
@keyframes pulse{50%{box-shadow:0 0 0 3px rgba(229,83,61,.05)}}
.tagbtn .name{overflow-wrap:break-word;hyphens:auto;font-size:18px}
.hint{font-size:13px;color:var(--muted);margin-top:8px}
details.data{background:var(--surface);border:1px solid var(--line);border-radius:var(--r)}
details.data summary{cursor:pointer;padding:12px 16px;font-family:var(--f-display);font-size:20px;font-weight:700;list-style:none;display:flex;justify-content:space-between;gap:8px}
details.data summary::-webkit-details-marker{display:none}
details.data summary::after{content:"+";color:var(--muted)}
details.data[open] summary::after{content:"–"}
.fields{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px;padding:0 16px 16px}
.fields .full{grid-column:1/-1}
@media (max-width:420px){.fields{grid-template-columns:1fr}}
.log{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);overflow:hidden}
.log-scroll{max-height:520px;overflow:auto}
.log-scroll table{min-width:900px}
.log-scroll td input{min-width:90px}
table{width:100%;border-collapse:collapse;font-size:14px}
th{position:sticky;top:0;background:var(--surface);text-align:left;font-size:11px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);padding:8px 10px;font-weight:600;border-bottom:1px solid var(--line);z-index:1}
td{border-top:1px solid var(--line);padding:6px 10px;vertical-align:middle}
td.num{font-family:var(--f-mono);font-variant-numeric:tabular-nums;white-space:nowrap;font-size:13px}
td .sw{display:inline-block;width:10px;height:10px;border-radius:3px;margin-right:6px;vertical-align:middle}
td input{padding:4px 6px;font-size:13px}
.counts{display:flex;flex-wrap:wrap;gap:6px;padding:10px 12px;border-bottom:1px solid var(--line)}
.counts span{font-size:12px;background:var(--surface-2);border-radius:99px;padding:2px 9px}
.counts b{font-family:var(--f-mono)}

/* ---------- overlay ---------- */
#ovroot2 .ov{z-index:25}
.crop{display:flex;flex-direction:column;gap:12px;align-items:center}
.crop canvas{width:min(280px,80vw);height:min(280px,80vw);border-radius:50%;border:1px solid var(--line);cursor:grab;touch-action:none;background:var(--surface-2)}
.crop canvas.drag{cursor:grabbing}
.crop .zoom{display:flex;gap:10px;align-items:center;width:min(280px,80vw)}
.crop .zoom input{flex:1}
.crop .bgs{display:flex;gap:8px;align-items:center;flex-wrap:wrap;justify-content:center}

.ov{position:fixed;inset:0;z-index:20;background:rgba(8,14,10,.55);display:flex;align-items:flex-start;justify-content:center;overflow:auto;padding:max(24px,env(safe-area-inset-top,0px)) max(12px,env(safe-area-inset-right,0px)) 24px max(12px,env(safe-area-inset-left,0px))}
.modal{background:var(--surface);border:1px solid var(--line);border-radius:14px;width:min(920px,100%);padding:18px;display:flex;flex-direction:column;gap:14px;box-shadow:var(--shadow)}
.modal h2{font-size:24px}
.modal .foot{display:flex;flex-wrap:wrap;gap:8px;justify-content:flex-end}
.btable{overflow-x:auto}
.btable table{min-width:860px}
.btable td{padding:5px 6px}
.btable input[type=color]{width:38px;height:32px;padding:0;border:1px solid var(--line);border-radius:6px;background:none}
.btable input.key{width:52px;text-align:center;text-transform:uppercase}
.btable input.n{width:64px}
pre.xml{background:var(--surface-2);border-radius:8px;padding:12px;font-family:var(--f-mono);font-size:12px;max-height:340px;overflow:auto;margin:0;white-space:pre}
.toast{position:fixed;left:50%;bottom:calc(20px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--fg);color:var(--bg);padding:9px 16px;border-radius:8px;font-weight:600;z-index:30;max-width:calc(100% - 32px)}
.qp{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:8px}
.qp button{display:flex;align-items:center;gap:8px;border:1px solid var(--line);background:var(--surface-2);border-radius:8px;padding:10px 12px;cursor:pointer;text-align:left;min-width:0;font-weight:500}

.qp.qpath button{flex-direction:column;align-items:stretch;gap:0;padding:0;overflow:hidden;background:var(--surface)}
.qp.qpath .av{width:100%;height:auto;aspect-ratio:1;border-radius:0;font-size:34px;background:var(--surface-2)}
.qp.qpath .nm{padding:8px 8px 9px;text-align:center;white-space:normal;line-height:1.15;font-size:14px;font-weight:600}
.qp-grp{margin:14px 0 6px;font-family:var(--f-display);font-weight:700;font-size:13px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);border-bottom:1px solid var(--line);padding-bottom:4px}
.qp-grp:first-child{margin-top:0}
.qp.rate{grid-template-columns:1fr 1fr}
.qp.rate button{justify-content:center;min-height:72px;font-family:var(--f-display);font-size:22px;font-weight:700;letter-spacing:.02em;color:#111}
.qp.rate .pos{background:#86efac}.qp.rate .adj{background:#fdba74}
.pitchwrap{display:flex;flex-direction:column;gap:8px;align-items:center}
.pitch{width:100%;max-width:560px;aspect-ratio:105/68;display:block;border-radius:6px;cursor:crosshair;touch-action:none;background:#2f8f4e}

.pitch .arrow{fill:rgba(255,255,255,.35);stroke:none}
.coord{font-family:var(--f-mono);font-size:13px;color:var(--muted);min-height:1.4em}
.qp-h{display:flex;align-items:center;justify-content:space-between;gap:10px;flex-wrap:wrap}
.qp-h .tagname{font-family:var(--f-display);font-weight:700;font-size:16px;padding:3px 10px;border-radius:4px;color:#111}
.athstrip{display:none}
.ath{border:1px solid var(--line);background:var(--surface);border-radius:99px;padding:5px 11px;cursor:pointer;font-size:14px;font-weight:600;display:inline-flex;gap:6px;align-items:center}
.av{width:24px;height:24px;border-radius:50%;object-fit:cover;flex:none;background:var(--surface-2);display:inline-grid;place-items:center;font-size:11px;font-weight:700;color:var(--muted);overflow:hidden}
.av.lg{width:44px;height:44px;font-size:15px}
.ath.hasav{padding-left:4px}
.photo-cell{display:flex;align-items:center;gap:6px}

.ath .nr{font-size:11px;color:var(--muted);font-weight:500}
.ath[aria-pressed=true]{background:var(--accent);color:var(--accent-fg);border-color:transparent}

<script>
(function(){
"use strict";
const $=(s,el=document)=>el.querySelector(s);
const $$=(s,el=document)=>Array.from(el.querySelectorAll(s));
const newId=()=>Math.random().toString(36).slice(2,9)+Date.now().toString(36).slice(-5);
function textOn(h){h=String(h||"#888").replace("#","");if(h.length===3)h=h.split("").map(c=>c+c).join("");const n=parseInt(h,16)||0,r=(n>>16)&255,g=(n>>8)&255,b=n&255;return (0.299*r+0.587*g+0.114*b)>150?"#111":"#fff"}
const esc=s=>String(s??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const LS_KEY="dimastag.v1";

/* ---------------- storage (private per user via db; local fallback) ---------------- */
const store={
  db:null,uid:null,cloud:false,analyses:{},config:{kind:"config",defaults:{}},timers:{},status:"",
  loadLocal(){try{const raw=localStorage.getItem(LS_KEY);if(raw){const o=JSON.parse(raw);this.analyses=o.analyses||{};if(o.config)this.config=o.config}}catch(e){}},
  saveLocal(){try{localStorage.setItem(LS_KEY,JSON.stringify({analyses:this.analyses,config:this.config}))}catch(e){}},
  async connect(){
    try{
      if(!window.claude||!claude.use)return;
      const [db,user]=await Promise.all([claude.use("db"),claude.use("user")]);
      if(!db||!user)return;
      const id=await user.id(); if(!id)return;
      this.db=db;this.uid=id;
      const snap=await db.collection("data/users/"+id).get();
      const remote={};let remoteCfg=null;
      snap.docs.forEach(d=>{let v=d.data();if(!v)return;v=JSON.parse(JSON.stringify(v));if(v.kind==="config")remoteCfg=v;else if(v.kind==="analysis")remote[d.id]=v});
      for(const [k,v] of Object.entries(remote)){const loc=this.analyses[k];if(!loc||(v.updatedAt||0)>=(loc.updatedAt||0))this.analyses[k]=v}
      for(const [k,v] of Object.entries(this.analyses)){if(!remote[k]||(v.updatedAt||0)>(remote[k].updatedAt||0))this.push(k)}
      if(remoteCfg)this.config=remoteCfg; else if(Object.keys(this.config.defaults||{}).length)this.pushConfig();
      this.cloud=true;this.saveLocal();
    }catch(e){this.db=null;this.cloud=false}
  },
  ref(id){return this.db.collection("data/users/"+this.uid).doc(id)},
  push(id){
    if(fb.on){fb.pushAnalysis(id);return}
    if(!this.db)return;
    clearTimeout(this.timers[id]);
    this.timers[id]=setTimeout(async()=>{
      const a=this.analyses[id];if(!a)return;
      try{await this.ref(id).set(JSON.parse(JSON.stringify(a)));setSave("Salvo na sua conta")}
      catch(e){setSave(e&&e.code==="quota_exceeded"?"Espaço da conta cheio: salvo só neste navegador":"Salvo só neste navegador")}
    },700);
  },
  pushConfig(){if(fb.on){fb.pushConfig();return}if(!this.db)return;this.ref("config").set(JSON.parse(JSON.stringify(this.config))).catch(()=>{})},
  save(a){a.updatedAt=Date.now();this.analyses[a.id]=a;this.saveLocal();setSave(fb.on?(navigator.onLine?"Sincronizando…":"Salvo no aparelho, envia ao conectar"):(this.db?"Salvando…":"Salvo neste navegador"));this.push(a.id)},
  remove(id){delete this.analyses[id];this.saveLocal();if(fb.on){fb.col("analyses").doc(id).delete().catch(()=>{});return}if(this.db)this.ref(id).delete().catch(()=>{})},
  saveConfig(){this.saveLocal();this.pushConfig()}
};
function setSave(t){store.status=t;const el=$("#savestate");if(el)el.textContent=t}

/* ---------------- Firebase sync (standalone/PWA only) ----------------
   Enabled when firebase-config.js defines window.FB_CONFIG and the Firebase compat SDK is loaded.
   Data: users/{uid}/analyses/{id}, users/{uid}/athletes/{id} (photo as data URI), users/{uid}/meta/config.
   Firestore keeps an offline cache and queues writes, so the app works offline and syncs when online. */
const fb={
  ready:false,on:false,user:null,unsub:[],timers:{},
  init(){
    if(!(window.FB_CONFIG&&window.firebase&&firebase.firestore))return;
    try{
      firebase.initializeApp(FB_CONFIG);
      this.auth=firebase.auth();this.fs=firebase.firestore();
      try{this.fs.settings({ignoreUndefinedProperties:true,merge:true})}catch(e){}
      this.fs.enablePersistence({synchronizeTabs:true}).catch(()=>{});
      this.ready=true;
      this.auth.onAuthStateChanged(u=>{this.user=u||null;this.on=!!u;if(u)this.attach();else this.detach();renderSyncState();if(!cur)renderHome()});
    }catch(e){this.ready=false}
  },
  col(name){return this.fs.collection("users").doc(this.user.uid).collection(name)},
  clean(o){return JSON.parse(JSON.stringify(o))},
  attach(){
    this.detach();const self=this;
    /* analyses: remote newer wins, local newer is pushed */
    this.unsub.push(this.col("analyses").onSnapshot(snap=>{
      let changed=false;const seen=new Set();
      snap.docChanges().forEach(ch=>{const id=ch.doc.id;seen.add(id);
        if(ch.type==="removed"){if(store.analyses[id]&&!ch.doc.metadata.hasPendingWrites){delete store.analyses[id];changed=true}return}
        const v=ch.doc.data();if(!v||v.kind!=="analysis")return;const loc=store.analyses[id];
        if(!loc||(v.updatedAt||0)>(loc.updatedAt||0)){store.analyses[id]=v;changed=true}
        else if((loc.updatedAt||0)>(v.updatedAt||0))self.pushAnalysis(id);
      });
      if(!snap.metadata.fromCache&&!self.seeded){self.seeded=true;const ids=new Set(snap.docs.map(d=>d.id));for(const id of Object.keys(store.analyses))if(!ids.has(id))self.pushAnalysis(id)}
      if(changed){store.saveLocal();if(cur){const f=store.analyses[cur.id];if(f&&f!==cur){cur=f;renderAnalysis()}else if(!f){cur=null;renderHome();toast("Análise removida em outro aparelho")}}else renderHome()}
      setSave(snap.metadata.hasPendingWrites?"Salvo no aparelho, envia ao conectar":"Sincronizado");
    },()=>{}));
    /* athletes */
    this.unsub.push(this.col("athletes").onSnapshot(snap=>{
      if(snap.empty&&snap.metadata.fromCache&&!self.rosterSeen)return;
      self.rosterSeen=true;
      if(snap.empty&&!snap.metadata.fromCache&&roster().length){self.pushRoster();return}
      let list=snap.docs.map(d=>Object.assign({id:d.id},d.data())).sort((a,b)=>(a.order||0)-(b.order||0)||String(a.name).localeCompare(b.name));
      /* first server snapshot after sign-in: keep local athletes the account does not have yet, then push them */
      if(!snap.metadata.fromCache&&!self.rosterMerged){self.rosterMerged=true;const have=new Set(list.map(p=>normName(p.name)));const extra=roster().filter(p=>p.name&&!have.has(normName(p.name)));if(extra.length){list=list.concat(extra);try{store.config.roster=list}catch(e){store.config=Object.assign({},store.config,{roster:list})}store.saveLocal();self.pushRoster();if(!cur)renderHome();return}}
      try{store.config.roster=list}catch(e){store.config=Object.assign({},store.config,{roster:list})}
      store.saveLocal();if(!cur)renderHome();
    },()=>{}));
    /* meta/config: defaults + protocols */
    this.unsub.push(this.col("meta").doc("config").onSnapshot(d=>{
      const v=d.data();if(!v){if(!d.metadata.fromCache)self.pushConfig();return}
      try{if(v.defaults)store.config.defaults=v.defaults;if(v.protocols)store.config.protocols=v.protocols}catch(e){store.config=Object.assign({},store.config,{defaults:v.defaults||{},protocols:v.protocols||[]})}
      store.saveLocal();
    },()=>{}));
  },
  detach(){this.unsub.forEach(u=>{try{u()}catch(e){}});this.unsub=[];this.seeded=false;this.rosterSeen=false;this.rosterMerged=false},
  pushAnalysis(id){
    if(!this.on)return;clearTimeout(this.timers[id]);
    this.timers[id]=setTimeout(()=>{const a=store.analyses[id];if(!a)return;this.col("analyses").doc(id).set(this.clean(a)).then(()=>setSave("Sincronizado")).catch(()=>setSave("Salvo no aparelho, envia ao conectar"))},600);
  },
  pushRoster(){
    if(!this.on)return;const list=roster();const batch=this.fs.batch();const ids=new Set();
    list.forEach((p,i)=>{ids.add(p.id);const d=this.clean(Object.assign({},p,{order:i}));delete d.id;batch.set(this.col("athletes").doc(p.id),d)});
    this.col("athletes").get().then(snap=>{snap.docs.forEach(d=>{if(!ids.has(d.id))batch.delete(d.ref)});return batch.commit()}).catch(()=>{});
  },
  pushConfig(){
    if(!this.on)return;
    this.pushRoster();
    this.col("meta").doc("config").set(this.clean({defaults:store.config.defaults||{},protocols:store.config.protocols||[]})).catch(()=>{});
  },
  async signIn(email,pass){await this.auth.signInWithEmailAndPassword(email,pass)},
  async signUp(email,pass){await this.auth.createUserWithEmailAndPassword(email,pass)},
  async reset(email){await this.auth.sendPasswordResetEmail(email)},
  async signOut(){await this.auth.signOut()}
};

/* ---------------- time helpers ---------------- */
const now=()=>Date.now();
const clockMs=c=>c.acc+(c.running?now()-c.since:0);
function fmt(ms,withTenths){
  const neg=ms<0;ms=Math.abs(ms);
  const s=Math.floor(ms/1000),h=Math.floor(s/3600),m=Math.floor(s%3600/60),ss=s%60;
  const base=(h?h+":"+String(m).padStart(2,"0"):String(m).padStart(2,"0"))+":"+String(ss).padStart(2,"0");
  return (neg?"-":"")+base+(withTenths?"."+Math.floor(ms%1000/100):"");
}
const fmtS=sec=>fmt(sec*1000);

const THEME_KEY=LS_KEY+".theme";
function getTheme(){try{return localStorage.getItem(THEME_KEY)||"system"}catch(e){return "system"}}
function applyTheme(t){const r=document.documentElement;if(t==="light"||t==="dark")r.setAttribute("data-theme",t);else r.removeAttribute("data-theme");try{localStorage.setItem(THEME_KEY,t)}catch(e){}}
function isDarkNow(){const t=getTheme();return t==="dark"||(t==="system"&&matchMedia("(prefers-color-scheme: dark)").matches)}

    :`<svg viewBox="0 0 24 24" aria-hidden="true"><path d="M21 12.8A9 9 0 1 1 11.2 3a7 7 0 0 0 9.8 9.8Z"/></svg>`}</button>`}
function wireTheme(){const b=$("#themebtn");if(!b)return;b.onclick=()=>{applyTheme(isDarkNow()?"light":"dark");b.outerHTML=themeBtn();wireTheme()}}

function toast(msg){const t=$("#toast");t.textContent=msg;t.hidden=false;clearTimeout(toast._t);toast._t=setTimeout(()=>t.hidden=true,2200)}

function genSec(){return clockMs(cur.clock.general)/1000}
/* Total task time: sum of closed blocks/periods plus the one still running. */
function taskMs(a){let ms=0;for(const x of a.sessions||[]){if(x.end!=null)ms+=(x.duration!=null?x.duration:Math.max(0,x.end-x.start))*1000}if(a.clock.session&&a.clock.session.open)ms+=clockMs(a.clock.session);return ms}
function sessSec(){return clockMs(cur.clock.session)/1000}
function openSession(){const s=cur.sessions[cur.sessions.length-1];return s&&s.end==null?s:null}

    :(s.running?`<button class="btn" data-s="pause" type="button">Pausar</button>`:`<button class="btn primary" data-s="resume" type="button">Retomar</button>`)+`<button class="btn" data-s="end" type="button">${w.single?"Encerrar":"Encerrar "+w.n}</button>`;

function genAction(act){
  const g=cur.clock.general;
  if(act==="start"){g.since=now();g.running=true}
  else if(act==="pause"){g.acc=clockMs(g);g.running=false}
  else if(act==="reset"){const wr=$("#gresetwrap");
    wr.innerHTML=`<span>Zerar tempos e apagar tags?</span><button class="btn sm danger" type="button" id="gyes">Sim</button><button class="btn sm" type="button" id="gno">Não</button>`;
    $("#gyes").onclick=()=>{cur.clock.general={running:false,acc:0,since:0};cur.clock.session={running:false,acc:0,since:0,open:false};cur.tags=[];cur.sessions=[];cur.openToggles={};store.save(cur);renderClocks();renderPad();renderLog()};
    $("#gno").onclick=renderClocks;return}
  store.save(cur);renderClocks();
}
function sesAction(act){
  const a=cur,s=a.clock.session,g=a.clock.general;
  if(act==="start"){
    if(!g.running){g.since=now();g.running=true}
    const name=W(a).auto?nextBlockName(a):((a.sessionName||W(a).N).trim()||W(a).N);
    a.sessions.push({id:newId(),name,start:genSec(),end:null});
    a.clock.session={running:true,acc:0,since:now(),open:true};
  }else if(act==="pause"){s.acc=clockMs(s);s.running=false}
  else if(act==="resume"){s.since=now();s.running=true}
  else if(act==="end"){
    const os=openSession();if(os){os.end=genSec();os.duration=sessSec()}
    a.clock.session={running:false,acc:0,since:0,open:false};
    const p=SESSION_PRESETS[a.type],i=p.indexOf(os&&os.name);
    a.sessionName=i>=0&&i<p.length-1?p[i+1]:(os?os.name:W(a).N);
    toast(W(a).N+" encerrado: "+(os?os.name:""));
  }
  store.save(a);renderClocks();renderLog();
}
/* Blocks with their task time (the open block counts live). */
function blockRows(a){
  const rows=[],ss=a.sessions,w=W(a);
  ss.forEach((x,i)=>{
    const live=x.end==null,dur=live?clockMs(a.clock.session)/1000:(x.duration!=null?x.duration:Math.max(0,x.end-x.start));
    rows.push({kind:"block",name:x.name||(w.N+" "+(i+1)),sec:dur,live});
  });
  return rows;
}
function blockListHTML(a){
  return blockRows(a).map(r=>`<div class="bl"><b>${esc(r.name)}:</b><span class="${r.live?"live":""}">${fmtS(r.sec)}</span></div>`).join("");
}
function updateTimes(){
  if(!cur)return;
  const ts=$("#t-ses");if(!ts)return;
  ts.textContent=fmt(clockMs(cur.clock.session));
  const bl=$("#blocklist");if(bl){const h=blockListHTML(cur);if(h!==bl.innerHTML)bl.innerHTML=h}
  for(const [bid,st] of Object.entries(cur.openToggles||{})){const el=$(`[data-live="${bid}"]`);if(el)el.textContent="gravando "+fmtS(Math.max(0,genSec()-st.start))}
}
function startTick(){stopTick();tick=setInterval(updateTimes,200)}
function stopTick(){if(tick)clearInterval(tick);tick=null}

function renderPad(){

    :`<div class="empty">Nenhum botão. Use “Editar botões”.</div>`);

function fireTag(bid){
  const a=cur,b=btnOf(a,bid);if(!b)return;
  const g=a.clock.general;
  if(!g.running&&clockMs(g)===0){toast(W(a).single?"Inicie a sessão antes de taguear":"Inicie o período antes de taguear");return}
  const t=genSec(),os=openSession(),sess=os?os.name:"",st=os?sessSec():null;
  const el=$(`[data-tag="${bid}"]`);if(el){el.classList.add("flash");setTimeout(()=>el.classList.remove("flash"),140)}
  let tag;
  if(b.mode==="toggle"){
    const o=a.openToggles[bid];
    if(!o){a.openToggles[bid]={start:t,session:sess,st};store.save(a);renderPad();toast(b.name+" · início "+fmtS(t));return}
    delete a.openToggles[bid];
    tag={btn:b.id,code:b.name,start:o.start,end:Math.max(t,o.start+0.1),t:o.start,session:o.session,st:o.st,athletes:[]};
    renderPad();
  }else{
    tag={btn:b.id,code:b.name,start:Math.max(0,t-(+b.lead||0)),end:t+(+b.lag||0),t,session:sess,st,athletes:[]};
  }
  /* Key behaviours are team-level: no athlete, straight to Reforço/Ajuste (also in jogo, no pitch). */
  if(b.id===ACTION_BTN.id){quickPick(b,tag,{scope:true});return}
  if(grp(b)===KEY_GROUP){quickPick(b,tag,{ratingOnly:true});return}
  if(b.ask===false||!roster().length){addTag(tag);toast(b.name+" · "+fmtS(t));return}
  quickPick(b,tag);
}

/* pitch map: 105 x 68 m drawn in a 0..100 x 0..100 coordinate space (x along the length, attack left→right; y along the width, 0 at the top) */
function pitchSVG(pos){
  return `<svg class="pitch" id="pitch" viewBox="-2 -2 109 72" aria-label="Campograma" role="img">
    <rect x="0" y="0" width="105" height="68"/><line x1="52.5" y1="0" x2="52.5" y2="68"/><circle class="l" cx="52.5" cy="34" r="9.15"/>
    <rect x="0" y="13.84" width="16.5" height="40.32"/><rect x="88.5" y="13.84" width="16.5" height="40.32"/>
    <rect x="0" y="24.84" width="5.5" height="18.32"/><rect x="99.5" y="24.84" width="5.5" height="18.32"/>
    <path d="M16.5 26.7 A9.15 9.15 0 0 1 16.5 41.3"/><path d="M88.5 26.7 A9.15 9.15 0 0 0 88.5 41.3"/>
    <circle class="l" cx="11" cy="34" r=".6"/><circle class="l" cx="94" cy="34" r=".6"/><circle class="l" cx="52.5" cy="34" r=".6"/>
    <path class="arrow" d="M44 63 h12 v-2.2 l5 3.4 -5 3.4 v-2.2 h-12z"/>
    ${pos?`<circle class="mark" cx="${(pos.x/100*105).toFixed(2)}" cy="${(pos.y/100*68).toFixed(2)}" r="1.8"/>`:""}
  </svg>`}
function wirePitch(root,tag,onSet){
  const svg=$("#pitch",root);
  const set=e=>{const r=svg.getBoundingClientRect();
    /* viewBox has a 2-unit margin on each side */
    const vx=(e.clientX-r.left)/r.width*109-2,vy=(e.clientY-r.top)/r.height*72-2;
    const x=Math.max(0,Math.min(100,vx/105*100)),y=Math.max(0,Math.min(100,vy/68*100));
    tag.pos={x:Math.round(x*10)/10,y:Math.round(y*10)/10};
    let m=svg.querySelector(".mark");if(!m){m=document.createElementNS("http://www.w3.org/2000/svg","circle");m.setAttribute("class","mark");m.setAttribute("r","1.8");svg.appendChild(m)}
    m.setAttribute("cx",(tag.pos.x/100*105).toFixed(2));m.setAttribute("cy",(tag.pos.y/100*68).toFixed(2));onSet&&onSet()};
  svg.onpointerdown=e=>{e.preventDefault();set(e)};
}
function openTagPitch(tagId){

    <div class="foot"><button class="btn sm ghost" type="button" id="pt-clear">Remover posição</button><button class="btn" type="button" id="pt-cancel">Cancelar</button><button class="btn primary" type="button" id="pt-ok">Salvar</button></div></div></div>`;
  wirePitch($("#ovroot2"),t,()=>{$("#pt-coord").textContent=`x ${t.pos.x} · y ${t.pos.y}`});

/* after a tag click: step 1 athlete, step 2 rating. The tag's time was already captured. */
function quickPick(b,tag,opts){
  opts=opts||{};
  const r=groupedRoster().flatMap(g=>g.players),KEYS="123456789qwertyuiopasdfghjklzxcvbnm";
  const box=$("#ovroot2");
  const done=()=>{box.innerHTML="";addTag(tag);toast(tag.code+(tag.scope?" · "+tag.scope:"")+(tag.rating?" · "+tag.rating:"")+(tag.pos?` · ${tag.pos.x},${tag.pos.y}`:"")+" · "+fmtS(tag.t))};
  /* Ação ends with an optional note; every other button saves straight away. */
  const finish=()=>opts.scope?stepNote():done();
  const stepNote=()=>{
    box.innerHTML=`<div class="ov"><div class="modal" role="dialog" aria-modal="true" aria-label="Nota" style="width:min(520px,100%)">
      ${head("nota")}
      <textarea id="qn-text" rows="3" placeholder="Escreva uma observação (opcional)" style="width:100%;resize:vertical;font:inherit;padding:10px;border:1px solid var(--line);border-radius:8px;background:var(--surface);color:var(--fg)"></textarea>
      <div class="foot"><button class="btn sm ghost" type="button" id="qp-skip">Sem nota</button><button class="btn primary" type="button" id="qn-ok">Salvar nota</button></div></div></div>`;
    const ta=$("#qn-text",box);
    const save=()=>{const v=ta.value.trim();if(v)tag.note=v;done()};
    $("#qp-skip").onclick=()=>{done()};
    $("#qn-ok").onclick=save;
    box.onkeydown=e=>{if(e.key==="Enter"&&!e.shiftKey){save()}else if(e.key==="Escape"){done()}else return;e.preventDefault()};
    ta.focus();
  };
  const lbl=(n,txt)=>opts.scope?txt:n+" · "+txt;

  const stepPitch=()=>{

function roster(){if(!store.config.roster){try{store.config.roster=[]}catch(e){store.config=Object.assign({},store.config,{roster:[]})}}return store.config.roster}
function photoSrc(p){return p&&p.photo?(p.photo.asset?"/_blob/"+p.photo.asset:p.photo.data||""):""}
function initials(n){return String(n||"?").trim().split(/\s+/).slice(0,2).map(w=>w[0]||"").join("").toUpperCase()}
function avatar(p,cls){const src=photoSrc(p);return src?`<img class="av ${cls||""}" src="${esc(src)}" alt="">`:`<span class="av ${cls||""}" aria-hidden="true">${esc(initials(p.name))}</span>`}
function canvasBlob(c,q){return new Promise((res,rej)=>c.toBlob(b=>b?res(b):rej(new Error("img")),"image/jpeg",q))}
async function makePhoto(src){
  try{const assets=window.claude&&claude.use?await claude.use("assets"):null;
    if(assets){const c=cropRender(src,320);const r=await assets.upload(await canvasBlob(c,.85),{type:"image/jpeg"});return {asset:r.id}}}catch(e){}
  return {data:cropRender(src,256).toDataURL("image/jpeg",.8)};
}
/* src = {img, zoom, x, y, bg}: x/y are the image center offset in crop-units (0..1 of the crop side), zoom = scale over the cover size */
function cropRender(src,size){
  const c=document.createElement("canvas");c.width=c.height=size;const ctx=c.getContext("2d");
  ctx.fillStyle=src.bg||"#ffffff";ctx.fillRect(0,0,size,size);
  const img=src.img,cover=size/Math.min(img.width,img.height),sc=cover*src.zoom,w=img.width*sc,h=img.height*sc;
  ctx.drawImage(img,size/2-w/2+src.x*size,size/2-h/2+src.y*size,w,h);return c;
}
function loadImg(file){return new Promise((res,rej)=>{const url=URL.createObjectURL(file);const img=new Image();img.onload=()=>res(img);img.onerror=()=>{URL.revokeObjectURL(url);rej(new Error("img"))};img.src=url})}
function openCropper(file,done){
  loadImg(file).then(img=>{
    const BGS=[["#ffffff","Branco"],["#f0f0f0","Cinza-claro"],["#737373","Cinza"],["#000000","Preto"],["#9b65c5","Roxo"],["#512465","Roxo-escuro"]];
    const src={img,zoom:1,x:0,y:0,bg:"#ffffff"};let custom=false;
    $("#ovroot2").innerHTML=`<div class="ov"><div class="modal" role="dialog" aria-modal="true" aria-labelledby="cr-h" style="width:min(460px,100%)">
      <h2 id="cr-h">Ajustar foto</h2>
      <div class="crop">
        <canvas id="cr-c" width="320" height="320" aria-label="Pré-visualização do recorte"></canvas>
        <div class="zoom"><span class="muted" style="font-size:12px">Zoom</span><input type="range" id="cr-z" min="1" max="4" step="0.01" value="1" aria-label="Zoom"><button class="btn sm ghost" type="button" id="cr-reset">Centralizar</button></div>
        <div class="bgs"><span class="muted" style="font-size:12px;margin-right:4px">Fundo</span>
          ${BGS.map(([c,n])=>`<button type="button" data-bg="${c}" title="${n}" aria-label="${n}" aria-pressed="${c===src.bg}" style="background:${c}"></button>`).join("")}
          <input type="color" id="cr-custom" value="#dcdcdc" title="Outra cor" aria-label="Outra cor">
        </div>
        <p class="hint" style="margin:0;text-align:center">Arraste a foto para posicionar. O fundo aparece nas bordas e atrás de imagens sem fundo (PNG).</p>
      </div>
      <div class="foot"><button class="btn" type="button" id="cr-cancel">Cancelar</button><button class="btn primary" type="button" id="cr-ok">Usar foto</button></div>
    </div></div>`;
    const c=$("#cr-c"),ctx=c.getContext("2d");
    const clamp=()=>{const cover=1/Math.min(img.width,img.height),w=img.width*cover*src.zoom,h=img.height*cover*src.zoom;
      const mx=Math.max(0,(w-1)/2),my=Math.max(0,(h-1)/2);src.x=Math.min(mx,Math.max(-mx,src.x));src.y=Math.min(my,Math.max(-my,src.y))};
    const paint=()=>{clamp();ctx.clearRect(0,0,320,320);ctx.drawImage(cropRender(src,320),0,0)};
    paint();
    $("#cr-z").oninput=e=>{src.zoom=+e.target.value;paint()};
    $("#cr-reset").onclick=()=>{src.x=src.y=0;src.zoom=1;$("#cr-z").value=1;paint()};
    const setBg=v=>{src.bg=v;$$("#ovroot2 [data-bg]").forEach(b=>b.setAttribute("aria-pressed",!custom&&b.dataset.bg===v));paint()};
    $$("#ovroot2 [data-bg]").forEach(b=>b.onclick=()=>{custom=false;setBg(b.dataset.bg)});
    $("#cr-custom").oninput=e=>{custom=true;setBg(e.target.value)};
    let drag=null;
    c.onpointerdown=e=>{drag={px:e.clientX,py:e.clientY,x:src.x,y:src.y};c.setPointerCapture(e.pointerId);c.classList.add("drag")};
    c.onpointermove=e=>{if(!drag)return;const r=c.getBoundingClientRect();src.x=drag.x+(e.clientX-drag.px)/r.width;src.y=drag.y+(e.clientY-drag.py)/r.height;paint()};
    c.onpointerup=c.onpointercancel=()=>{drag=null;c.classList.remove("drag")};
    c.onwheel=e=>{e.preventDefault();src.zoom=Math.min(4,Math.max(1,src.zoom*(e.deltaY<0?1.08:1/1.08)));$("#cr-z").value=src.zoom;paint()};
    $("#cr-cancel").onclick=()=>{$("#ovroot2").innerHTML="";done(null)};
    $("#cr-ok").onclick=()=>{$("#ovroot2").innerHTML="";done(src)};
  }).catch(()=>{toast("Não consegui ler essa imagem");done(null)});

/* ---------------- roster sync with the published page (elenco.json) ----------------
   Export: downloads the roster with photos embedded, to be committed as public/elenco.json.
   Sync: fetches elenco.json next to the app; replaces the roster, keeping ids of same-named athletes so tags stay linked. */
async function photoDataURI(p){
  const src=photoSrc(p);if(!src)return "";if(src.startsWith("data:"))return src;
  try{const b=await (await fetch(src)).blob();return await new Promise(res=>{const fr=new FileReader();fr.onload=()=>res(fr.result);fr.readAsDataURL(b)})}catch(e){return ""}
}
async function exportRoster(rows){
  const list=rows.filter(p=>String(p.name).trim());if(!list.length)return toast("Nenhum atleta para exportar");
  toast("Preparando elenco…");
  const athletes=[];for(const p of list){const d=await photoDataURI(p);athletes.push({name:String(p.name).trim(),pos:String(p.pos||"").trim(),cat:String(p.cat||"").trim(),...(d?{photo:{data:d}}:{})})}
  const json=JSON.stringify({updatedAt:new Date().toISOString(),athletes},null,1);
  try{
    const dl=window.claude&&claude.use?await claude.use("downloads"):null;
    if(dl){await dl.save({filename:"elenco.json",data:new Blob([json],{type:"application/json"})});toast("elenco.json salvo");return}
  }catch(e){if(e&&e.code==="declined")return}
  const u=URL.createObjectURL(new Blob([json],{type:"application/json"}));const el=document.createElement("a");el.href=u;el.download="elenco.json";document.body.appendChild(el);el.click();el.remove();setTimeout(()=>URL.revokeObjectURL(u),3000);toast("elenco.json salvo");
}
function normName(n){return String(n||"").normalize("NFD").replace(/[\u0300-\u036f]/g,"").toLowerCase().replace(/\s+/g," ").trim()}
async function syncRoster(o){
  o=o||{};
  if(window.claude&&claude.use&&!o.force)return null; /* inside the artifact there is no published elenco.json */
  let data;
  try{const r=await fetch("elenco.json?t="+Date.now(),{cache:"no-store"});if(!r.ok)throw 0;data=await r.json()}catch(e){if(!o.silent)toast("Não foi possível baixar o elenco da página");return null}
  const list=Array.isArray(data&&data.athletes)?data.athletes.filter(p=>p&&String(p.name).trim()):[];
  if(!list.length){if(!o.silent)toast("A página ainda não tem elenco publicado");return {applied:false}}
  const stamp=String(data.updatedAt||"");
  if(!o.force&&stamp&&stamp<=String(store.config.rosterSyncedAt||""))return {applied:false};
  const old=roster(),byName=new Map(old.map(p=>[normName(p.name),p]));
  const next=list.map(p=>{const ex=byName.get(normName(p.name));return {id:ex?ex.id:newId(),name:String(p.name).trim(),pos:String(p.pos||"").trim(),cat:String(p.cat||"").trim(),...(p.photo&&p.photo.data?{photo:{data:p.photo.data}}:(ex&&ex.photo?{photo:ex.photo}:{}))}});
  try{store.config.roster=next;store.config.rosterSyncedAt=stamp||new Date().toISOString()}catch(e){store.config=Object.assign({},store.config,{roster:next,rosterSyncedAt:stamp})}
  store.saveConfig();
  if(!o.silent)toast("Elenco atualizado: "+next.length+" atletas");
  return {applied:true,count:next.length};
}
function parseSheetRows(rows){
  rows=rows.map(r=>(r||[]).map(c=>c==null?"":String(c).trim())).filter(r=>r.some(Boolean));
  if(!rows.length)return [];
  const h=rows[0].map(x=>x.toLowerCase());
  const find=re=>h.findIndex(x=>re.test(x));
  let iName=find(/nome|atleta|jogador|name/),iPos=find(/fun[çc][aã]o|posi|role/),iCat=find(/categ|cat\b|sub|equipe|time/);
  let body=rows;
  if(iName>=0)body=rows.slice(1);
  else{iName=0;iPos=1;iCat=2}
  return body.map(r=>({name:r[iName]||"",pos:iPos>=0?(r[iPos]||""):"",cat:iCat>=0?(r[iCat]||""):""})).filter(x=>x.name);
}
function athLabel(id){const p=roster().find(x=>x.id===id);return p?p.name:null}
function sortedRoster(){return roster().slice().sort((x,y)=>String(x.name).localeCompare(y.name))}
/* Athletes grouped by role, in tactical order. Role text is free (from the spreadsheet), so match by normalized prefix. */
const ROLE_GROUPS=[["Goleiros",["goleir","gol","gk"]],["Zagueiros",["zag","zac","central","defensor"]],["Laterais",["lat","ala"]],["Volantes",["vol","primeiro vol","1º vol"]],["Meias",["mei","mc","armador","meio"]],["Extremos",["ext","pont","wing"]],["Atacantes",["atac","ata","centro","cent","9"]]];
function normRole(r){return String(r||"").normalize("NFD").replace(/[\u0300-\u036f]/g,"").toLowerCase().trim()}
function roleGroup(p){const n=normRole(p.pos);if(!n)return "Sem função";for(const [g,ks] of ROLE_GROUPS){if(ks.some(k=>n.startsWith(k)))return g}return "Outros"}
function groupedRoster(){const r=sortedRoster(),order=ROLE_GROUPS.map(x=>x[0]).concat(["Outros","Sem função"]),m=new Map();for(const p of r){const g=roleGroup(p);if(!m.has(g))m.set(g,[]);m.get(g).push(p)}return order.filter(g=>m.has(g)).map(g=>({name:g,players:m.get(g)}));}

/* ---------------- XML export (Nacsport instance format) ---------------- */
function hexTo16(h){h=(h||"#888888").replace("#","");if(h.length===3)h=h.split("").map(c=>c+c).join("");const n=parseInt(h,16);return[(n>>16)&255,(n>>8)&255,n&255].map(v=>v*256)}
const xe=s=>String(s??"").replace(/[<>&'"]/g,c=>({"<":"&lt;",">":"&gt;","&":"&amp;","'":"&apos;",'"':"&quot;"}[c]));
const r2=n=>String(+(Math.round(n*10000)/10000).toFixed(4));
function freeText(t,code,opts){const parts=[];const n=String(t.note||"").trim();
  if(opts.details&&t.rating)parts.push(t.rating);
  if(n)parts.push(n);
  if(opts.details){[t.scope==="Individual"&&tagAthLabels(t).length?"":t.scope,t.kb!==code?t.kb:"",t.cp!==code?t.cp:""].forEach(v=>{if(v)parts.push(v)});
    if(t.pos)parts.push("X "+t.pos.x+" / Y "+t.pos.y)}
  return parts.join(" | ")}
function buildXML(a,opts){
  const off=+a.videoOffset||0,gNow=clockMs(a.clock.general)/1000;
  const tags=a.tags.slice();
  for(const [bid,o] of Object.entries(a.openToggles||{})){const b=a.buttons.find(x=>x.id===bid);if(b)tags.push({btn:bid,code:b.name,start:o.start,end:Math.max(gNow,o.start+0.1),session:o.session,st:o.st,athletes:o.athletes||[],note:"(aberto ao exportar)"})}
  const inst=tags.map(t=>({start:t.start,end:t.end,code:t.code,text:freeText(t,t.code,opts),labels:tagAthLabels(t)}));
  if(opts.sessions&&!W(a).single)a.sessions.forEach(s=>inst.push({start:s.start,end:s.end==null?gNow:s.end,code:W(a).N,text:s.name}));
  inst.sort((x,y)=>x.start-y.start);
  const I="    ",lines=["<file>",I+"<ALL_INSTANCES>"];
  inst.forEach((it,i)=>{
    lines.push(I+I+"<instance>");
    lines.push(I+I+I+"<ID>"+(i+1)+"</ID>");
    lines.push(I+I+I+"<start>"+r2(Math.max(0,it.start+off))+"</start>");
    lines.push(I+I+I+"<end>"+r2(Math.max(0,it.end+off))+"</end>");
    lines.push(I+I+I+"<code>"+xe(it.code)+"</code>");
    if(it.text)lines.push(I+I+I+"<free_text>"+xe(it.text)+"</free_text>");
    (it.labels||[]).forEach(l=>{lines.push(I+I+I+"<label>");lines.push(I+I+I+I+"<group>Atleta</group>");lines.push(I+I+I+I+"<text>"+xe(l)+"</text>");lines.push(I+I+I+"</label>")});
    lines.push(I+I+"</instance>");
  });
  lines.push(I+"</ALL_INSTANCES>");
  lines.push(I+"<ROWS>");
  /* row order follows the pad: Ação, Comportamentos-chave, Conceitos, then Sincronia / blocos */
  const order=[ACTION_BTN.name,...a.buttons.filter(b=>grp(b)===KEY_GROUP).map(b=>b.name),...a.buttons.filter(b=>grp(b)!==KEY_GROUP).map(b=>b.name)];
  const rank=c=>{const k=order.indexOf(c);return k<0?order.length+(c==="Sincronia"?0:1):k};
  const codes=[...new Set(inst.map(i=>i.code))].sort((x,y)=>rank(x)-rank(y));
  codes.forEach((c,k)=>{const b=a.buttons.find(x=>x.name===c)||(c===ACTION_BTN.name?ACTION_BTN:null);const [R,G,Bc]=hexTo16(b?b.color:(c==="Sincronia"?"#000000":"#d4d4d8"));
    lines.push(I+I+"<row>");lines.push(I+I+I+"<code>"+xe(c)+"</code>");lines.push(I+I+I+"<R>"+R+"</R>");lines.push(I+I+I+"<G>"+G+"</G>");lines.push(I+I+I+"<B>"+Bc+"</B>");lines.push(I+I+I+"<sort_order>"+(k+1)+"</sort_order>");lines.push(I+I+"</row>")});
  lines.push(I+"</ROWS>");
  lines.push("</file>");
  return lines.join("\n");
}
function safeName(s){return (s||"analise").normalize("NFD").replace(/[̀-ͯ]/g,"").replace(/[^\w\- ]+/g,"").trim().replace(/\s+/g,"_").slice(0,60)||"analise"}

    $("#ovroot").innerHTML=`<div class="ov"><div class="modal" role="dialog" aria-modal="true" aria-labelledby="ex-h">
      <h2 id="ex-h">Gerar XML</h2>
      <p class="muted" style="margin:0">Formato Nacsport (ID, start, end, code e free_text com a nota), com tempos em segundos contados a partir do ${W(a).single?"início da sessão":"início do primeiro período"}. ${a.tags.length} tags${nOpen?`, mais ${nOpen} botão liga/desliga ainda aberto (entra fechado no tempo atual)`:""}.</p>
      <div style="display:flex;flex-wrap:wrap;gap:16px">
        <label style="display:flex;gap:6px;align-items:center"><input type="checkbox" id="ex-meta" ${opts.details?"checked":""}> Qualificação e rótulos no texto livre</label>
        ${W(a).single?"":`<label style="display:flex;gap:6px;align-items:center"><input type="checkbox" id="ex-ses" ${opts.sessions?"checked":""}> Incluir ${W(a).n}s como instâncias</label>`}
      </div>
      <pre class="xml" id="ex-pre">${esc(xml)}</pre>
      <div class="foot">
        ${a.clock.general.running?`<button class="btn" type="button" id="ex-stop">Parar tempo</button>`:""}
        <button class="btn" type="button" id="ex-close">Fechar</button>
        <button class="btn" type="button" id="ex-copy">Copiar XML</button>
        <button class="btn primary" type="button" id="ex-dl">Baixar XML (.zip)</button>
      </div>
      <p class="hint" style="margin:0" id="ex-note">O navegador do Claude só permite baixar alguns formatos, então o arquivo .xml vai dentro de um .zip. Se o download não estiver disponível, use “Copiar XML”.</p>
    </div></div>`;
    $("#ex-meta").onchange=e=>{opts.details=e.target.checked;draw()};
    const exs=$("#ex-ses");if(exs)exs.onchange=e=>{opts.sessions=e.target.checked;draw()};
    $("#ex-close").onclick=closeOv;
    const st=$("#ex-stop");if(st)st.onclick=()=>{const os=openSession();if(os){os.end=genSec();os.duration=sessSec()}
      a.clock.session={running:false,acc:0,since:0,open:false};a.clock.general.acc=clockMs(a.clock.general);a.clock.general.running=false;store.save(a);renderClocks();draw();toast("Relógios parados")};
    $("#ex-copy").onclick=()=>{const txt=buildXML(a,opts);
      const p=navigator.clipboard&&navigator.clipboard.writeText?navigator.clipboard.writeText(txt):Promise.reject();
      p.then(()=>toast("XML copiado")).catch(()=>{const r=document.createRange();r.selectNodeContents($("#ex-pre"));const s=getSelection();s.removeAllRanges();s.addRange(r);toast("Texto selecionado: use Ctrl+C")})};
    $("#ex-dl").onclick=async()=>{
      const txt=buildXML(a,opts),base=safeName(a.title)+"_"+(a.info.data||new Date().toISOString().slice(0,10));
      try{
        const dl=window.claude&&claude.use?await claude.use("downloads"):null;
        if(!dl){ /* standalone / PWA: plain browser download of the .xml */
          const u=URL.createObjectURL(new Blob([txt],{type:"application/xml"}));const el=document.createElement("a");el.href=u;el.download=base+".xml";document.body.appendChild(el);el.click();el.remove();setTimeout(()=>URL.revokeObjectURL(u),3000);toast("Arquivo salvo");return;
        }
        if(!window.JSZip)throw {code:"unavailable"};
        const zip=new JSZip();zip.file(base+".xml",txt);
        const blob=await zip.generateAsync({type:"blob"});
        await dl.save({filename:base+".zip",data:blob});toast("Arquivo salvo");
      }catch(e){
        if(e&&e.code==="declined")return;
        $("#ex-note").textContent="Download indisponível nesta visualização. Use “Copiar XML” e cole num arquivo .xml.";
      }
    };
  };
  draw();
}

/* ---------------- screen wake lock (keeps tablet awake while tagging) ---------------- */
let wake=null;
async function requestWake(){try{if(navigator.wakeLock&&!wake){wake=await navigator.wakeLock.request("screen");wake.addEventListener("release",()=>wake=null)}}catch(e){}}
function releaseWake(){try{wake&&wake.release()}catch(e){}wake=null}
document.addEventListener("visibilitychange",()=>{if(document.visibilityState==="visible"&&cur)requestWake()});

/* ---------------- boot ---------------- */
store.loadLocal();
if(!store.config.defaults)store.config.defaults={};
if(!store.config.roster)store.config.roster=[];
if(!store.config.protocols)store.config.protocols=[];
let seeded=false;
try{seeded=localStorage.getItem(LS_KEY+".seeded")==="1"}catch(e){}
if(!Object.keys(store.analyses).length&&!seeded){const ex=exampleAnalysis();store.analyses[ex.id]=ex;store.saveLocal();try{localStorage.setItem(LS_KEY+".seeded","1")}catch(e){}}
fb.init();
renderHome();
store.connect().then(()=>{if(store.cloud){if(cur){const fresh=store.analyses[cur.id];if(fresh&&fresh!==cur){cur=fresh;renderAnalysis()}}else renderHome()}});
/* Standalone app: pull the published roster (elenco.json) when it is newer than the last sync. */
if(!(window.claude&&claude.use)&&navigator.onLine){syncRoster({silent:true}).then(r=>{if(r&&r.applied){toast("Elenco atualizado da página: "+r.count+" atletas");if(!cur)renderHome()}}).catch(()=>{})}
})();
</script>
